name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your Free Mobile API key: the logs of the integration do not contain it (the identifier is masked), but check before posting.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.4'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: The Supervision tab of the integration in Gladys.
      placeholder: '1.3.0'
    validations:
      required: true
  - type: input
    id: sent-from
    attributes:
      label: What sends the message
      description: A scene action (which one), an alarm, a notification from another integration…
      placeholder: 'Scene action "Send a message", channel Free Mobile SMS'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Did the SMS arrive late, twice, cut, or not at all? Any error shown in Gladys?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (its Supervision tab in Gladys), ideally with the SDK debug logs: add the environment variable `DEBUG=gladys-integration-sdk` to the container, reproduce, then copy the lines.
      render: text
