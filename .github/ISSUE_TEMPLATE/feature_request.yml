name: Feature request
description: Something the integration could do for you.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The use case first (a scene, an alert, a notification…), then the idea. The Free Mobile SMS API only sends a text to the line's own number.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Gladys and integration versions
      placeholder: 'Gladys 5.1.4, integration 1.3.0'
