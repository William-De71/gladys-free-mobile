<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What happens to one outgoing message</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 1 queue -->
  <rect x="25" y="50" width="185" height="120" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="117" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#0a3069">1. Queue</text>
  <text x="40" y="102" font-size="11" fill="#24292f">messages of one account</text>
  <text x="40" y="119" font-size="11" fill="#24292f">leave one after the other;</text>
  <text x="40" y="136" font-size="11" fill="#24292f">other accounts are not</text>
  <text x="40" y="153" font-size="11" fill="#24292f">held back</text>

  <!-- 2 split -->
  <rect x="245" y="50" width="185" height="120" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="337" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#6b4600">2. Split</text>
  <text x="260" y="102" font-size="11" fill="#24292f">≤ 999 chars: one SMS</text>
  <text x="260" y="119" font-size="11" fill="#24292f">longer: cut on spaces and</text>
  <text x="260" y="136" font-size="11" fill="#24292f">line breaks, "(1/3)"…,</text>
  <text x="260" y="153" font-size="11" fill="#24292f">1 s between the parts</text>

  <!-- 3 send -->
  <rect x="465" y="50" width="185" height="120" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="557" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">3. POST /sendmsg</text>
  <text x="480" y="102" font-size="11" fill="#24292f">JSON body, HTTPS,</text>
  <text x="480" y="119" font-size="11" fill="#24292f">10 s timeout</text>
  <text x="480" y="146" font-size="11" fill="#57606a">timeout: not retried (the</text>
  <text x="480" y="161" font-size="11" fill="#57606a">SMS may already be sent)</text>

  <!-- 4 outcomes -->
  <rect x="690" y="35" width="165" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="772" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#116329">200: delivered</text>
  <rect x="690" y="92" width="165" height="44" rx="8" fill="#fff8e6" stroke="#bf8700"/>
  <text x="772" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#6b4600">402 / 500: not sent</text>
  <text x="772" y="128" text-anchor="middle" font-size="11" fill="#6b4600">safe to retry</text>
  <rect x="690" y="149" width="165" height="44" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="772" y="169" text-anchor="middle" font-size="12" font-weight="600" fill="#a40e26">400 / 403: error</text>
  <text x="772" y="185" text-anchor="middle" font-size="11" fill="#a40e26">reported to Gladys</text>

  <line x1="210" y1="110" x2="243" y2="110" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="110" x2="463" y2="110" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="90" x2="688" y2="57" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="112" x2="688" y2="114" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="134" x2="688" y2="170" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Retry loop -->
  <path d="M855,114 C874,114 874,232 820,232 L600,232 C557,232 557,205 557,174" fill="none" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="700" y="262" text-anchor="middle" font-size="12" fill="#6b4600">retry after 2 s, then 5 s — then give up with a readable error</text>
</svg>
