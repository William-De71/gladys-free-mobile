<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Setting up Free Mobile SMS in Gladys</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="330" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Free Mobile side -->
  <rect x="20" y="20" width="490" height="290" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 5"/>
  <text x="40" y="45" font-size="12" font-weight="600" fill="#57606a">FREE MOBILE SUBSCRIBER AREA — mobile.free.fr</text>

  <rect x="40" y="65" width="140" height="70" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="110" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">1. Sign in</text>
  <text x="110" y="114" text-anchor="middle" font-size="11" fill="#57606a">your Free Mobile line</text>

  <rect x="205" y="65" width="140" height="70" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="275" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">2. Mes options</text>
  <text x="275" y="114" text-anchor="middle" font-size="11" fill="#57606a">(My options)</text>

  <rect x="370" y="65" width="125" height="70" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="432" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">3. Enable</text>
  <text x="432" y="106" text-anchor="middle" font-size="11" fill="#57606a">Notifications</text>
  <text x="432" y="121" text-anchor="middle" font-size="11" fill="#57606a">par SMS</text>

  <line x1="180" y1="100" x2="203" y2="100" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="100" x2="368" y2="100" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Credentials card -->
  <rect x="40" y="165" width="455" height="125" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="58" y="190" font-size="13" font-weight="600" fill="#24292f">4. The same page shows</text>
  <text x="58" y="220" font-size="12" fill="#24292f">Customer ID</text>
  <rect x="200" y="204" width="150" height="24" rx="5" fill="#eef6ff" stroke="#0969da"/>
  <text x="275" y="221" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0a3069">12345678</text>
  <text x="58" y="256" font-size="12" fill="#24292f">API key</text>
  <rect x="200" y="240" width="210" height="24" rx="5" fill="#fff8e6" stroke="#bf8700"/>
  <text x="305" y="257" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b4600">aBcD3fGh1jK1mN</text>
  <text x="58" y="282" font-size="11" fill="#cf222e">Disable + re-enable the option = a new key</text>
  <line x1="432" y1="135" x2="432" y2="163" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gladys side -->
  <rect x="580" y="65" width="280" height="225" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="720" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#0a3069">Gladys — Configuration</text>
  <text x="600" y="118" font-size="12" font-weight="600" fill="#24292f">My account</text>
  <text x="600" y="143" font-size="11" fill="#57606a">Free Mobile identifier</text>
  <rect x="600" y="150" width="240" height="24" rx="5" fill="#ffffff" stroke="#0969da"/>
  <text x="610" y="167" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0a3069">12345678</text>
  <text x="600" y="196" font-size="11" fill="#57606a">Free Mobile API key</text>
  <rect x="600" y="203" width="240" height="24" rx="5" fill="#ffffff" stroke="#bf8700"/>
  <text x="610" y="220" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b4600">••••••••••••••</text>
  <rect x="600" y="245" width="90" height="28" rx="6" fill="#0969da"/>
  <text x="645" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5. Save</text>
  <text x="700" y="264" font-size="11" fill="#57606a">per user, stored encrypted</text>

  <!-- Copy arrows -->
  <path d="M350,216 C470,216 520,162 598,162" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M410,252 C500,252 530,215 598,215" fill="none" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="535" y="150" text-anchor="middle" font-size="11" fill="#57606a">copy</text>
</svg>
